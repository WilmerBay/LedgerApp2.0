name: CI/CD to EC2

on:
  push:
    branches: [ ci/pipeline ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Verify jar file exists
        run: |
          echo "Listing JAR files in target/"
          ls -lh target

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: target/bankapp-0.0.1-SNAPSHOT.jar
          target: /home/ubuntu/
          strip_components: 0
          overwrite: true
          rm: false

      - name: SSH into EC2 and build Docker container
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Navigate to deployment directory
            cd /home/ubuntu

            # Stop and remove old container
            docker stop bankapp || true
            docker rm bankapp || true

            # Remove old Docker image
            docker rmi bankapp || true

            # Remove old JAR file if exists
            rm -f bankapp.jar

            # Rename uploaded JAR file
            mv bankapp-0.0.1-SNAPSHOT.jar bankapp.jar

            # Create Dockerfile dynamically
            echo -e "FROM openjdk:17-jdk-slim\nCOPY bankapp.jar app.jar\nENTRYPOINT [\"java\",\"-jar\",\"app.jar\"]" > Dockerfile

            # Build and run
            docker build -t bankapp .
            docker run -d -p 8080:8080 --name bankapp bankapp
      
